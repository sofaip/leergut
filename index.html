<!DOCTYPE html>
<html lang="de">
<head>

<meta charset="UTF-8">

<title>Pfand Tracker</title>

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>

<!-- ПІДКЛЮЧЕННЯ JS -->
<script src="script.js"></script>

<style>
body{
    font-family: monospace;
    padding:20px;
    background:#f2f2f2;
}

.receipt{
    background:white;
    padding:20px;
    max-width:350px;
    margin:auto;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
}

input{
    width:60px;
}

button{
    padding:10px;
    margin-top:10px;
}

.line{
    display:flex;
    justify-content:space-between;
}

.center{
    text-align:center;
}

.small{
    font-size:12px;
}
</style>

</head>

<body>

<div class="receipt">

<div class="center">
<h3>TOMRA DEMO</h3>
<p>PRIVATE TRACKER</p>
</div>

<div class="line">
<span>0.08€</span>
<input type="number" id="g" value="0">
</div>

<div class="line">
<span>0.15€</span>
<input type="number" id="b15" value="0">
</div>

<div class="line">
<span>0.25€</span>
<input type="number" id="b25" value="0">
</div>

<div class="line">
<span>1.50€</span>
<input type="number" id="k" value="0">
</div>

<button onclick="gen()">GENERATE</button>

<hr>

<div id="output"></div>

<div class="center">
<svg id="barcode"></svg>
</div>

</div>

</body>
</html>
