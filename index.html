<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Pfand Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <script src="script.js"></script>
  <style>
    body{
      font-family: monospace;
      padding:20px;
      background:#f2f2f2;
    }
    .receipt{
      background:white;
      padding:20px;
      max-width:350px;
      margin:auto;
      box-shadow:0 0 10px rgba(0,0,0,0.2);
    }
    input{ width:80px; }
    button{
      padding:10px;
      margin-top:10px;
      width:100%;
    }
    .line{
      display:flex;
      justify-content:space-between;
      margin-bottom:8px;
    }
    .center{ text-align:center; }
    .small{
      font-size:12px;
      word-break:break-all;
    }
    #prefix12{ width:140px; }
  </style>
</head>
<body>
  <div class="receipt">
    <div class="center">
      <h3>TOMRA DEMO</h3>
      <p>PRIVATE TRACKER</p>
    </div>

    <div class="line">
      <span>0.08€ пляшки</span>
      <input type="number" id="g" value="0">
    </div>
    <div class="line">
      <span>0.15€ пляшки</span>
      <input type="number" id="b15" value="0">
    </div>
    <div class="line">
      <span>0.25€ пляшки</span>
      <input type="number" id="b25" value="0">
    </div>
    <div class="line">
      <span>1.50€ ящики</span>
      <input type="number" id="k" value="0">
    </div>

    <hr>

    <div class="line">
      <span>Перші 12 цифр:</span>
      <input type="text" id="prefix12" maxlength="12" value="100001015582">
    </div>

    <button onclick="gen()">GENERATE</button>

    <hr>
    <div id="output"></div>
    <div class="center">
      <svg id="barcode"></svg>
    </div>
  </div>
</body>
</html>
